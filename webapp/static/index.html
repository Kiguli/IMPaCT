<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IMPaCT — visualizer</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --ink:#e6edf3; --muted:#8b949e; --accent:#4493f8; --line:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  .wrap { display:flex; height:calc(100vh - 53px); }
  .controls { width:380px; padding:16px 18px; border-right:1px solid var(--line); overflow:auto; }
  .controls label { display:block; margin:12px 0 4px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  textarea, select, input { width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  textarea { height:240px; resize:vertical; white-space:pre; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button.go { margin-top:16px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px; font-weight:600; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  .view { flex:1; position:relative; overflow:hidden; }
  #graph { width:100%; height:100%; display:block; }
  #msg { position:absolute; top:12px; left:12px; right:12px; padding:8px 12px; border-radius:6px; background:#3d1f23; color:#ffb3ba; border:1px solid #8b3a3a; display:none; }
  .legend { position:absolute; bottom:14px; left:14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; }
  .bar { width:160px; height:12px; border-radius:3px; margin:6px 0 2px; background:linear-gradient(90deg,#d1495b,#edae49,#66a182); }
  .barlabels { display:flex; justify-content:space-between; color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; text-transform:none; letter-spacing:0; }
  .examples { display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px; }
  .examples button { width:auto; padding:5px 9px; font-size:12px; font-weight:500; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:14px; cursor:pointer; }
  .examples button:hover { border-color:var(--accent); color:var(--accent); }
  .modes { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .modes button { padding:6px 10px; font-size:12px; font-weight:600; background:transparent; color:var(--muted); border:1px solid transparent; border-radius:6px; cursor:pointer; }
  .modes button:hover { color:var(--ink); }
  .modes button.active { background:var(--accent); color:#fff; }
  .sections { display:flex; gap:6px; margin-bottom:14px; }
  .sections button { flex:1; padding:9px 12px; font-size:14px; font-weight:700; background:var(--panel); color:var(--muted); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .sections button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  #warm { margin:0 0 10px; display:none; }
  textarea::placeholder, input::placeholder { color:#6b7682; }
  .info { font-size:13px; color:var(--ink); }
  .info p { margin:8px 0; } .info ul { margin:8px 0; padding-left:18px; } .info li { margin:4px 0; color:var(--muted); }
  .info code { background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }
  #tutorial { font-size:12px; margin:2px 0 10px; padding:9px 11px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--muted); }
  #tutorial b { color:var(--ink); }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .tbtn { padding:6px 10px; font-size:12px; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .tbtn:hover { border-color:var(--accent); color:var(--accent); }
  #anim { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:none; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:13px; box-shadow:0 4px 16px #0008; }
  #anim button { padding:4px 9px; font-size:13px; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  #anim input[type=range] { width:200px; }
  #anim .hint { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header><h1>IMPaCT</h1><span id="subtitle">visualizers for verified stochastic synthesis</span></header>
<div class="wrap">
  <div class="controls">
    <div class="sections" id="sections"></div>
    <div class="modes" id="modes"></div>
    <div id="warm"><label>Warm start <span class="hint">— pre-fill with a tutorial example</span></label>
      <select id="warmstart"></select></div>
    <label id="exLabel">Examples <span class="hint">— click to load &amp; run</span></label>
    <div class="examples" id="examples"></div>
    <div id="tutorial" class="info"></div>

    <div id="modePanel">
      <div id="c_sysform">
        <label>System builder <span class="hint">— no code; fills the .sys below</span></label>
        <div class="row">
          <div><label>decay a</label><input id="f_a" value="0.9"/></div>
          <div><label>control b</label><input id="f_b" value="0.5"/></div>
          <div><label>noise &sigma;</label><input id="f_sig" value="0.3"/></div>
        </div>
        <div class="row">
          <div><label>domain min</label><input id="f_min" value="-3"/></div>
          <div><label>domain max</label><input id="f_max" value="3"/></div>
          <div><label>grid &eta;</label><input id="f_eta" value="0.5"/></div>
        </div>
        <div class="row">
          <div><label>region lo</label><input id="f_rlo" value="1.5"/></div>
          <div><label>region hi</label><input id="f_rhi" value="3"/></div>
          <div><label>spec</label><select id="f_prop"><option>reach</option><option>safety</option></select></div>
        </div>
        <button class="tbtn" id="buildSys" style="margin-top:8px">&#10227; Build .sys from form, then run</button>
      </div>
      <label id="modelLabel">Model</label>
      <textarea id="model" spellcheck="false"></textarea>

      <div id="c_format" class="row">
        <div><label>Format</label>
          <select id="format"><option value="imdp">.imdp</option><option value="prism">PRISM</option></select></div>
        <div><label>Property</label>
          <select id="prop">
            <option value="reach">reach (F)</option><option value="safety">safety (G)</option>
            <option value="buchi">buchi (G F)</option><option value="persist">persist (F G)</option>
            <option value="patrol">patrol (&amp;G F)</option><option value="next">next (X)</option>
            <option value="until">until (U)</option><option value="ltl">LTL formula</option>
          </select></div>
      </div>
      <div id="c_label"><label>Label(s) / formula <span class="hint">— a,b for patrol/until; a formula for LTL</span></label>
        <input id="label" value="target"/></div>
      <div id="c_bound" class="row">
        <div><label>Bound</label>
          <select id="bound"><option value="both">both</option><option value="pess">robust</option><option value="opt">optimistic</option></select></div>
        <div><label>Color by</label>
          <select id="colorby"><option value="pess">robust</option><option value="opt">optimistic</option></select></div>
      </div>
      <div id="c_cap"><label>Max states to render</label><input id="cap" type="number" value="60" min="2"/></div>
      <div id="c_eps"><label>Precision &epsilon;</label><input id="eps" value="1e-6"/></div>
      <div id="c_horizon"><label>Horizon (steps)</label><input id="horizon" type="number" value="4" min="1"/></div>

      <button class="go" id="go">Run &amp; visualize</button>
      <div class="toolbar">
        <label class="tbtn">⬆ Upload<input type="file" id="upload" hidden></label>
        <button class="tbtn" id="download">⬇ Model</button>
        <button class="tbtn" id="downloadSvg">⬇ Figure (SVG)</button>
        <button class="tbtn" id="downloadJson">⬇ Results (JSON)</button>
        <button class="tbtn" id="exportImdp" style="display:none">⬇ Abstracted IMDP</button>
      </div>
      <button class="go" id="animate" style="background:#2d333b">▶ Animate value iteration</button>
      <div class="hint" id="status" style="margin-top:8px"></div>
    </div>
    <div id="aboutPanel" class="info" style="display:none"></div>
  </div>

  <div class="view">
    <svg id="graph"></svg>
    <div id="anim">
      <button id="animStepB" title="step back">◀</button>
      <button id="animPlay" title="play/pause">▶</button>
      <button id="animStepF" title="step forward">▶▶</button>
      <input type="range" id="animSlider" min="0" value="0"/>
      <span id="animLabel"></span><span id="animTitle" class="hint"></span>
      <button id="animClose" title="close">✕</button>
    </div>
    <div id="msg"></div>
    <div class="legend" id="legend">
      satisfaction probability<div class="bar"></div>
      <div class="barlabels"><span>0</span><span>0.5</span><span>1</span></div>
      <div style="margin-top:8px;color:var(--muted)" id="legendNote">◯ thick border = initial · ★ = labelled</div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
