<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>IMPaCT — IMDP visualizer</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2029; --ink:#e6edf3; --muted:#8b949e; --accent:#4493f8; --line:#30363d; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  .wrap { display:flex; gap:0; height:calc(100vh - 53px); }
  .controls { width:360px; padding:18px; border-right:1px solid var(--line); overflow:auto; }
  .controls label { display:block; margin:12px 0 4px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  textarea, select, input { width:100%; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; }
  textarea { height:230px; resize:vertical; white-space:pre; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { margin-top:16px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .view { flex:1; position:relative; overflow:hidden; }
  #graph { width:100%; height:100%; display:block; }
  #msg { position:absolute; top:12px; left:12px; right:12px; padding:8px 12px; border-radius:6px; background:#3d1f23; color:#ffb3ba; border:1px solid #8b3a3a; display:none; }
  .legend { position:absolute; bottom:14px; left:14px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12px; }
  .bar { width:160px; height:12px; border-radius:3px; margin:6px 0 2px; background:linear-gradient(90deg,#d1495b,#edae49,#66a182); }
  .barlabels { display:flex; justify-content:space-between; color:var(--muted); }
  .examples { margin-top:10px; font-size:12px; color:var(--muted); }
  .examples a { color:var(--accent); cursor:pointer; margin-right:10px; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>IMPaCT</h1><span>Interval-MDP visualizer — nodes are heat-mapped by robust satisfaction probability</span>
</header>
<div class="wrap">
  <div class="controls">
    <label>Model</label>
    <textarea id="model" spellcheck="false"></textarea>
    <div class="examples">load: <a data-ex="fork">interval fork</a><a data-ex="patrol">patrol (prism)</a><a data-ex="chain">point chain</a></div>

    <div class="row">
      <div><label>Format</label>
        <select id="format"><option value="imdp">.imdp</option><option value="prism">PRISM</option></select></div>
      <div><label>Property</label>
        <select id="prop"><option>reach</option><option>safety</option><option>buchi</option><option>persist</option><option>patrol</option></select></div>
    </div>
    <label>Label(s) <span class="hint">— comma-separated for patrol</span></label>
    <input id="label" value="target"/>
    <div class="row">
      <div><label>Bound</label>
        <select id="bound"><option value="both">both</option><option value="pess">robust (pess)</option><option value="opt">optimistic</option></select></div>
      <div><label>Color by</label>
        <select id="colorby"><option value="pess">robust</option><option value="opt">optimistic</option></select></div>
    </div>
    <label>Max states to render</label>
    <input id="cap" type="number" value="60" min="2"/>
    <button id="go">Solve &amp; visualize</button>
    <div class="hint" id="status"></div>
  </div>
  <div class="view">
    <svg id="graph"></svg>
    <div id="msg"></div>
    <div class="legend">
      satisfaction probability<div class="bar"></div>
      <div class="barlabels"><span>0</span><span>0.5</span><span>1</span></div>
      <div style="margin-top:8px;color:var(--muted)">◯ thick border = initial state · ★ = labelled state</div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
