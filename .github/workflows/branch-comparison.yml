name: Branch Comparison - Validate Merge

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: 'Base branch (e.g., main)'
        required: true
        default: 'main'
        type: string
      compare_branch:
        description: 'Branch to compare (e.g., refactor/phase1-io-utils)'
        required: true
        type: string
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - smoke
          - critical
          - comprehensive

jobs:
  build-base-image:
    name: "Build Base Image (${{ inputs.base_branch }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: impact:base-${{ github.run_id }}
          cache-from: type=gha,scope=base-${{ inputs.base_branch }}
          cache-to: type=gha,mode=max,scope=base-${{ inputs.base_branch }}

      - name: Save Docker image
        run: |
          docker save impact:base-${{ github.run_id }} -o base-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: base-docker-image
          path: base-image.tar
          retention-days: 1

  build-compare-image:
    name: "Build Compare Image (${{ inputs.compare_branch }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout compare branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.compare_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: impact:compare-${{ github.run_id }}
          cache-from: type=gha,scope=compare-${{ inputs.compare_branch }}
          cache-to: type=gha,mode=max,scope=compare-${{ inputs.compare_branch }}

      - name: Save Docker image
        run: |
          docker save impact:compare-${{ github.run_id }} -o compare-image.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: compare-docker-image
          path: compare-image.tar
          retention-days: 1

  test-base-branch:
    name: "Test Base: ${{ matrix.example }}"
    runs-on: ubuntu-latest
    needs: build-base-image

    strategy:
      fail-fast: false
      matrix:
        example:
          - ex_2Drobot-R-U
          - ex_2Drobot-R-D
          - ex_4DBAS-S
          - ex_load_reach
          - ex_load_safe

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: base-docker-image

      - name: Load Docker image
        run: |
          docker load -i base-image.tar

      - name: Compile and run example
        id: test
        timeout-minutes: 20
        run: |
          # Determine executable name
          case "${{ matrix.example }}" in
            *robot*)   EXEC="robot2D" ;;
            *BAS4D*|*4DBAS*)  EXEC="BAS4D" ;;
            *vehicle*) EXEC="vehicle3D" ;;
            *room3D*)  EXEC="room3D" ;;
            *room5D*)  EXEC="room5D" ;;
            *BAS7D*)   EXEC="BAS7D" ;;
            *load*)    EXEC="load" ;;
            *)         EXEC="" ;;
          esac

          # Create output directories
          mkdir -p outputs logs

          # Run in Docker
          docker run --rm \
            -v $(pwd)/outputs:/outputs \
            -v $(pwd)/logs:/logs \
            impact:base-${{ github.run_id }} \
            -c "
              cd /app/examples/${{ matrix.example }} && \
              echo '=== Compiling ===' && \
              make 2>&1 | tee /logs/compile.log && \
              echo '=== Running ===' && \
              if [ -n '$EXEC' ]; then
                ./$EXEC 2>&1 | tee /logs/run.log
              else
                FOUND_EXEC=\$(ls | grep -v '\\.' | head -n 1)
                ./\$FOUND_EXEC 2>&1 | tee /logs/run.log
              fi && \
              echo '=== Copying outputs ===' && \
              cp *.h5 /outputs/ 2>/dev/null || echo 'No HDF5 files found'
            "

          # Check results
          H5_COUNT=$(ls outputs/*.h5 2>/dev/null | wc -l)
          echo "output_count=$H5_COUNT" >> $GITHUB_OUTPUT
          if [ "$H5_COUNT" -gt 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Upload outputs
        if: steps.test.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: base-${{ matrix.example }}
          path: outputs/*.h5
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: base-logs-${{ matrix.example }}
          path: logs/
          retention-days: 7

  test-compare-branch:
    name: "Test Compare: ${{ matrix.example }}"
    runs-on: ubuntu-latest
    needs: build-compare-image

    strategy:
      fail-fast: false
      matrix:
        example:
          - ex_2Drobot-R-U
          - ex_2Drobot-R-D
          - ex_4DBAS-S
          - ex_load_reach
          - ex_load_safe

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: compare-docker-image

      - name: Load Docker image
        run: |
          docker load -i compare-image.tar

      - name: Compile and run example
        id: test
        timeout-minutes: 20
        run: |
          # Determine executable name
          case "${{ matrix.example }}" in
            *robot*)   EXEC="robot2D" ;;
            *BAS4D*|*4DBAS*)  EXEC="BAS4D" ;;
            *vehicle*) EXEC="vehicle3D" ;;
            *room3D*)  EXEC="room3D" ;;
            *room5D*)  EXEC="room5D" ;;
            *BAS7D*)   EXEC="BAS7D" ;;
            *load*)    EXEC="load" ;;
            *)         EXEC="" ;;
          esac

          # Create output directories
          mkdir -p outputs logs

          # Run in Docker
          docker run --rm \
            -v $(pwd)/outputs:/outputs \
            -v $(pwd)/logs:/logs \
            impact:compare-${{ github.run_id }} \
            -c "
              cd /app/examples/${{ matrix.example }} && \
              echo '=== Compiling ===' && \
              make 2>&1 | tee /logs/compile.log && \
              echo '=== Running ===' && \
              if [ -n '$EXEC' ]; then
                ./$EXEC 2>&1 | tee /logs/run.log
              else
                FOUND_EXEC=\$(ls | grep -v '\\.' | head -n 1)
                ./\$FOUND_EXEC 2>&1 | tee /logs/run.log
              fi && \
              echo '=== Copying outputs ===' && \
              cp *.h5 /outputs/ 2>/dev/null || echo 'No HDF5 files found'
            "

          # Check results
          H5_COUNT=$(ls outputs/*.h5 2>/dev/null | wc -l)
          echo "output_count=$H5_COUNT" >> $GITHUB_OUTPUT
          if [ "$H5_COUNT" -gt 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        continue-on-error: true

      - name: Upload outputs
        if: steps.test.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ matrix.example }}
          path: outputs/*.h5
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-logs-${{ matrix.example }}
          path: logs/
          retention-days: 7

  compare-results:
    name: Compare Branch Results
    runs-on: ubuntu-latest
    needs: [test-base-branch, test-compare-branch]
    if: always()

    steps:
      - name: Checkout code (for comparison scripts)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.compare_branch }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install h5py numpy pyyaml

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Compare outputs
        id: compare
        run: |
          echo "# Branch Comparison Report" > comparison-report.md
          echo "" >> comparison-report.md
          echo "**Base branch**: ${{ inputs.base_branch }}" >> comparison-report.md
          echo "**Compare branch**: ${{ inputs.compare_branch }}" >> comparison-report.md
          echo "**Test suite**: ${{ inputs.test_suite }}" >> comparison-report.md
          echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> comparison-report.md
          echo "" >> comparison-report.md

          echo "## Compilation Results" >> comparison-report.md
          echo "" >> comparison-report.md
          echo "| Example | Base Branch | Compare Branch | Status |" >> comparison-report.md
          echo "|---------|-------------|----------------|--------|" >> comparison-report.md

          # Check each example
          EXAMPLES="ex_2Drobot-R-U ex_2Drobot-R-D ex_4DBAS-S ex_load_reach ex_load_safe"

          TOTAL=0
          PASSED=0
          FAILED=0

          for example in $EXAMPLES; do
            TOTAL=$((TOTAL + 1))
            BASE_EXISTS=$([ -d "base-$example" ] && echo "true" || echo "false")
            COMPARE_EXISTS=$([ -d "compare-$example" ] && echo "true" || echo "false")

            if [ "$BASE_EXISTS" = "true" ] && [ "$COMPARE_EXISTS" = "true" ]; then
              echo "| $example | SUCCESS | SUCCESS | MATCH |" >> comparison-report.md
              PASSED=$((PASSED + 1))
            elif [ "$BASE_EXISTS" = "false" ] && [ "$COMPARE_EXISTS" = "false" ]; then
              echo "| $example | FAILED | FAILED | BOTH FAILED |" >> comparison-report.md
              FAILED=$((FAILED + 1))
            elif [ "$BASE_EXISTS" = "false" ]; then
              echo "| $example | FAILED | SUCCESS | BASE FAILED |" >> comparison-report.md
              FAILED=$((FAILED + 1))
            else
              echo "| $example | SUCCESS | FAILED | REGRESSION |" >> comparison-report.md
              FAILED=$((FAILED + 1))
            fi
          done

          echo "" >> comparison-report.md
          echo "**Total**: $TOTAL | **Passed**: $PASSED | **Failed**: $FAILED" >> comparison-report.md
          echo "" >> comparison-report.md

          # Output file comparison
          echo "## Output File Comparison" >> comparison-report.md
          echo "" >> comparison-report.md
          echo "| Example | Base Files | Compare Files | Status |" >> comparison-report.md
          echo "|---------|------------|---------------|--------|" >> comparison-report.md

          OUTPUTS_MATCH=0
          OUTPUTS_DIFFER=0

          for example in $EXAMPLES; do
            if [ -d "base-$example" ] && [ -d "compare-$example" ]; then
              BASE_COUNT=$(ls base-$example/*.h5 2>/dev/null | wc -l)
              COMPARE_COUNT=$(ls compare-$example/*.h5 2>/dev/null | wc -l)

              if [ "$BASE_COUNT" -eq "$COMPARE_COUNT" ]; then
                echo "| $example | $BASE_COUNT | $COMPARE_COUNT | MATCH |" >> comparison-report.md
                OUTPUTS_MATCH=$((OUTPUTS_MATCH + 1))
              else
                echo "| $example | $BASE_COUNT | $COMPARE_COUNT | DIFFERENT |" >> comparison-report.md
                OUTPUTS_DIFFER=$((OUTPUTS_DIFFER + 1))
              fi
            fi
          done

          echo "" >> comparison-report.md

          # Final verdict
          echo "## Final Verdict" >> comparison-report.md
          echo "" >> comparison-report.md

          if [ $FAILED -eq 0 ] && [ $OUTPUTS_DIFFER -eq 0 ]; then
            echo "### SAFE TO MERGE" >> comparison-report.md
            echo "" >> comparison-report.md
            echo "All tests passed on both branches with matching outputs." >> comparison-report.md
            echo "verdict=SAFE_TO_MERGE" >> $GITHUB_OUTPUT
          elif [ $FAILED -gt 0 ]; then
            echo "### ISSUES FOUND" >> comparison-report.md
            echo "" >> comparison-report.md
            echo "Some tests failed. Review logs before merging." >> comparison-report.md
            echo "verdict=ISSUES_FOUND" >> $GITHUB_OUTPUT
          else
            echo "### REVIEW REQUIRED" >> comparison-report.md
            echo "" >> comparison-report.md
            echo "Tests passed but output counts differ. Manual review recommended." >> comparison-report.md
            echo "verdict=REVIEW_REQUIRED" >> $GITHUB_OUTPUT
          fi

          echo "" >> comparison-report.md
          echo "---" >> comparison-report.md
          echo "*Generated by IMPaCT Branch Comparison Workflow*" >> comparison-report.md

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: comparison-report.md
          retention-days: 30

      - name: Display summary
        if: always()
        run: |
          cat comparison-report.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('comparison-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

      - name: Set workflow status
        if: always()
        run: |
          VERDICT="${{ steps.compare.outputs.verdict }}"
          if [ "$VERDICT" = "SAFE_TO_MERGE" ]; then
            echo "Verdict: SAFE TO MERGE"
            exit 0
          elif [ "$VERDICT" = "REVIEW_REQUIRED" ]; then
            echo "Verdict: REVIEW REQUIRED"
            exit 0  # Don't fail workflow, but flag for review
          else
            echo "Verdict: ISSUES FOUND"
            exit 1
          fi
